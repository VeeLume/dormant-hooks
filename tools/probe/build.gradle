plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

base {
    archivesName = 'dormant-hooks-probe'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.265'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
